<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-label="Aster theme illustration">
  <defs>
    <linearGradient id="sky" x1="40" y1="0" x2="360" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e9f8ff"/>
      <stop offset="0.46" stop-color="#e4e6ff"/>
      <stop offset="1" stop-color="#ffe1ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffd8ea" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd8ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillA" x1="0" y1="320" x2="420" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#d7e4ff" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="390" x2="420" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffd9e9" stop-opacity="0.36"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <symbol id="spark" viewBox="0 0 24 24">
      <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2z"/>
    </symbol>
  </defs>

  <rect width="420" height="520" fill="url(#sky)"/>
  <circle cx="318" cy="112" r="150" fill="url(#glow)"/>

  <g filter="url(#soft)" opacity="0.75">
    <ellipse cx="108" cy="150" rx="92" ry="34" fill="#ffffff"/>
    <ellipse cx="322" cy="236" rx="120" ry="30" fill="#ffffff"/>
    <ellipse cx="92" cy="292" rx="110" ry="26" fill="#ffe4f0"/>
  </g>

  <mask id="moonMask">
    <rect width="420" height="520" fill="#ffffff"/>
    <circle cx="327" cy="82" r="43" fill="#000000"/>
  </mask>
  <circle cx="304" cy="108" r="54" fill="#ffffff" opacity="0.9" mask="url(#moonMask)"/>

  <g fill="#ffffff" opacity="0.9">
    <use href="#spark" x="70" y="84" width="16" height="16"/>
    <use href="#spark" x="146" y="56" width="8" height="8" opacity="0.7"/>
    <use href="#spark" x="352" y="196" width="12" height="12" opacity="0.8"/>
    <use href="#spark" x="54" y="212" width="9" height="9" opacity="0.55"/>
    <use href="#spark" x="250" y="144" width="7" height="7" opacity="0.6"/>
  </g>
  <g fill="#ffb8d5" opacity="0.8">
    <use href="#spark" x="330" y="292" width="10" height="10"/>
    <use href="#spark" x="114" y="330" width="7" height="7" opacity="0.7"/>
  </g>
  <g fill="#9db8ff" opacity="0.8">
    <use href="#spark" x="198" y="228" width="8" height="8"/>
    <use href="#spark" x="372" y="344" width="9" height="9" opacity="0.6"/>
    <use href="#spark" x="42" y="368" width="7" height="7" opacity="0.6"/>
  </g>

  <path d="M0 372c70-38 124-30 184 4s138 42 236-16v160H0z" fill="url(#hillA)"/>
  <path d="M0 424c86-30 148 18 222 4s132-28 198 8v84H0z" fill="url(#hillB)"/>
  <path d="M0 466c92-22 156 18 238 4s118-18 182 2v48H0z" fill="#ffffff" opacity="0.34"/>

  <path d="M64 116c28-20 52-28 82-34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <path d="M56 108l10 4-8 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <g opacity="0.8">
    <circle cx="86" cy="414" r="3" fill="#ffffff"/>
    <circle cx="124" cy="392" r="2" fill="#ffc4dc"/>
    <circle cx="342" cy="404" r="3" fill="#ffffff"/>
    <circle cx="306" cy="430" r="2" fill="#b9c9ff"/>
  </g>
